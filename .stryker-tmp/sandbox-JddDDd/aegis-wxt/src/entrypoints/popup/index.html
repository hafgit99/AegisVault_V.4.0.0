<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegis Vault WXT Multi-Browser</title>
    <!-- Manifest V3 eklentileri her zaman harici stylesheet'leri destekler, CSP sebebiyle inline CSS kısıtlıdır -->
  </head>
  <style>
    :root {
      --bg-color: #f0eee9;
      --text-color: #0a1128;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #161d2b;
        --text-color: #e6edf8;
      }
    }
    body {
      width: 380px;
      min-height: 480px;
      padding: 0;
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
    #wxt-app {
      width: 100%;
      height: 100%;
    }
  </style>
  <body>
    <div id="wxt-app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
