name: Build/Release Aegis Vault

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: aegis-vault-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Extension Dependencies
        run: npm --prefix aegis-wxt ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Lint
        run: npm run lint

      - name: Unit Tests
        run: npm run test:unit:ci

      - name: Import/Export Regression Tests
        run: npm run test:import-export-regression

      - name: Security Regression Tests
        run: npm run test:security-regression

      - name: Extension Compile
        run: npm --prefix aegis-wxt run compile

      - name: Build Chrome Extension
        run: npm --prefix aegis-wxt run build

      - name: Build Firefox Extension
        run: npm --prefix aegis-wxt run build:firefox

      - name: Build Native Host Manifest
        env:
          AEGIS_EXTENSION_ID: iockeheicjcnfoegjjboooljndjcafae
          AEGIS_FIREFOX_EXTENSION_ID: aegisvault@example.com
        run: npm run build:native-host-manifest

      - name: Verify Native Host Manifest
        run: npm run verify:native-host-manifest

      - name: E2E Tests
        run: npm run test:e2e:ci

      - name: Generate CI Summary
        run: npm run ci:report

      - name: Enforce Quality Gate
        run: npm run ci:enforce:quality

      - name: Publish Quality Summary
        if: always()
        shell: bash
        run: |
          if [ -f "ci-artifacts/quality-summary.md" ]; then
            cat ci-artifacts/quality-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Quality Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-Vault-quality-reports
          path: |
            ci-artifacts/**
            test-results/**
            vitest-results/**
            playwright-report/**
            aegis-wxt/dist/**
            build/native-host/**
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: quality
    runs-on: ${{ matrix.os }}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      AEGIS_REQUIRE_SIGNED_RELEASE: "1"
      AEGIS_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.AEGIS_RELEASE_SIGNING_PRIVATE_KEY }}
      AEGIS_RELEASE_SIGNING_PUBLIC_KEY: ${{ secrets.AEGIS_RELEASE_SIGNING_PUBLIC_KEY }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Release Signing Environment
        run: npm run release:validate-signing-env

      - name: Build Application
        run: npm run build

      - name: Build Chrome Extension
        run: npm --prefix aegis-wxt run build

      - name: Build Firefox Extension
        run: npm --prefix aegis-wxt run build:firefox

      - name: Build Native Host Manifest
        env:
          AEGIS_EXTENSION_ID: iockeheicjcnfoegjjboooljndjcafae
          AEGIS_FIREFOX_EXTENSION_ID: aegisvault@example.com
        run: npm run build:native-host-manifest

      - name: Verify Native Host Manifest
        run: npm run verify:native-host-manifest

      - name: Build Electron App
        run: npm run build:electron

      - name: Release Smoke Test
        run: npm run release:smoke

      - name: Verify Release Trust Chain
        run: npm run release:verify

      - name: Generate CI Summary
        run: npm run ci:report

      - name: Enforce Release Gate
        run: npm run ci:enforce:release

      - name: Publish Release Summary
        if: always()
        shell: bash
        run: |
          if [ -f "ci-artifacts/quality-summary.md" ]; then
            cat ci-artifacts/quality-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Release Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-Vault-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.sha256
            release/*.blockmap
            release/*sbom*.json
            release/*provenance*.json
            release/*manifest*.json
            build/native-host/*
            ci-artifacts/**
          if-no-files-found: warn
          retention-days: 14
